# Auto-labels PRs by which bank scraper they touch.
# Consumed by actions/labeler (see .github/workflows/label-banks.yml).
# Format: https://github.com/actions/labeler

"scraper: hapoalim":
  - changed-files:
      - any-glob-to-any-file:
          - 'src/scrapers/hapoalim.ts'
          - 'src/scrapers/hapoalim.test.ts'

